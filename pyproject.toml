[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "digiflow.__version__"}

[project]
name = "digiflow"
dynamic = ["version"]
description = "Father's Little Digitization Workflow Helper"
readme = "README.md"
requires-python = ">=3.8"
authors = [
	{name = "Universitäts- und Landesbibliothek Sachsen-Anhalt", email = "development@bibliothek.uni-halle.de"}
]
classifiers = [
    "Intended Audience :: Developers",
	"Intended Audience :: Education",
	"Development Status :: 6 - Mature",
    "Programming Language :: Python :: 3",
]
license = "MIT"
dependencies = [
	"lxml",
	"Pillow",
	"numpy",
	"docker",
	"requests",
	"saxonche",
 	"openpyxl",
]

[project.urls]
Homepage = "https://github.com/ulb-sachsen-anhalt/digital-flow"

[project.optional-dependencies]
dev = ["black"]
test = ["pytest", "pytest-cov", "tox"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.tox]
requires = ["tox>=4.6"]
env_list = ["py310", "py312"]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
deps = ["pytest>=8.0"]
commands = [["pytest", "{posargs}"]]

[tool.tox.env.lint]
description = "Run code style checks"
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "."]]
